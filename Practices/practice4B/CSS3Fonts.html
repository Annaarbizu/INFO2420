<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS3 Embedded Fonts</title>

<style type="text/css">

@font-face {
    font-family: 'BookSheet';
    src: url('fonts/BookSheetRegular.woff2') format('woff2'),
         url('fonts/BookSheetRegular.woff') format('woff');
    font-weight: normal;
    font-style: normal;
}


.book-style {
	font-family: 'BookSheet', serif;
}



</style>


</head>
<body>

<p>
	<h1 class="book-style">This is my BookSheet font!</h1>
</p>



</body></html>
