<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rent a Pet - Graphics</title>

<style>


	#thumbs, #image {
		width: 700px;
		border: solid 1px #000;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
		background: #eee;
		padding: 5px;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:400px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script>

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "images/Print1.jpg"
	PrintButton2.src = "images/Print2.jpg"
	logo1.src = "images/Logo1.png"
	logo2.src = "images/Logo2.jpg"
}


		var imgArray = new Array(
			'Image1Lg.jpg',
			'Image2Lg.jpg',
			'Image3Lg.jpg',
			'Image4Lg.jpg'
			

		);


		var titleArray = new Array(
			'Dog Performing a Trick',
			'A Cat and Dog',
			'Angry Cat',
			'A Pig'
			
		);
			
		var imgPath = "images/fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div style="text-align: center;">

<div>
	<a href=""
   onMouseOver="document.getElementById('print').src='images/Print2.jpg';"
   onMouseOut="document.getElementById('print').src='images/Print1.jpg';">

	<img src="images/Print1.jpg" width="200" height="50" 
	id="print" alt="Print Button" style="border:none;"/>

	</a>
</div>


<div>
	<a href=""  onMouseOver="document.getElementById('logo').src='images/Logo2.jpg';"
     onMouseOut="document.getElementById('logo').src='images/Logo1.png';">


	<img src="images/Logo1.png" width="133" height="126" 
	id="logo" alt="logo" style="border:none;"/>

	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="images/thumbnails/Image1sm.jpg" alt="Dog doing Trick" onmouseover="swapImage(0);" />
		<img src="images/thumbnails/Image2sm.jpg" alt="A cat and a Dog" onmouseover="swapImage(1);" />
		<img src="images/thumbnails/Image3sm.jpg" alt="Angry Cat" onmouseover="swapImage(2);" />
		<img src="images/thumbnails/Image4sm.jpg" alt="A Pig" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">

		<img id="theImage" src="images/fullsize/Image1Lg.jpg" alt="Dog doing trick" />
		<h3 id="bottomText">Dog doing a Trick</h3>
	</div>

<br><br><br>
<img src="images/2colback.jpg" alt="Two Column Background">

<br />
<br />
<br />
<br />



</div>

<p>
    <a href="http://validator.w3.org/check?uri=referer"><img
      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
</p>
  

</body>
</html>
