<!DOCTYPE html>
<html>
<head>
    <title>My Color Palette</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .color-box {
            width: 120px;
            height: 120px;
            border-radius: 6px;
            margin: 10px;
            display: inline-block;
            border: 1px solid #ccc;
        }
        .label {
            margin-top: 5px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Color Scheme 1 – Friendly & Professional</h1>

    <div>
        <div class="color-box" style="background:#1F3A5F;"></div>
        <div class="label">#1F3A5F (Navy Blue)</div>

        <div class="color-box" style="background:#6BB9F0;"></div>
        <div class="label">#6BB9F0 (Sky Blue)</div>

        <div class="color-box" style="background:#F2E9D8;"></div>
        <div class="label">#F2E9D8 (Warm Beige)</div>

        <div class="color-box" style="background:#E8C07D;"></div>
        <div class="label">#E8C07D (Soft Gold)</div>
    </div>

</body>
</html>
